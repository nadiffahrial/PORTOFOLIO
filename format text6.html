<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style type="text/css">
        p.normal{
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-weight: normal;
        }
        p.thick{font-family: Verdana, Geneva, Tahoma, sans-serif; font-weight: bold;}
        p.thicker{
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-weight: 900;
        }
        

    </style>
</head>
<body>
    <p class="thick">THICK</p>
    <p class="thicker">THICKER</p>
    <p class="normal">NORMAL</p>
</body>
</html>
