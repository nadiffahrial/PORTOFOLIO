<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style type="text/css">
        p.italic{
            font-size: 200%;
            font-style: italic;
        }
        p.normal{
            font-size: 200%;
            font-style: normal;
        }
        p.oblique{
            font-size: 200%;
            font-style: oblique;
        }
    </style>
</head>
<body>
    <p class="italic">HURUF ITALIC</p>
    <p class="normal">HURUF NORMAL</p>
    <p class="oblique">HURUF OBLIQUE</p>
</body>
</html>
